name: Build
on:
  workflow_call:
    inputs:
      channel:
        description: Package channel (stable or nightly)
        type: string
        default: stable
      ref:
        description: Exact commit or release tag to validate and build
        type: string
        default: ""
      release_tag:
        description: Release tag (e.g. v0.1.0) used as the stable package version
        type: string
        default: ""
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_CHANNEL: ${{ inputs.channel }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Build release binaries
        run: cargo build --locked --release --workspace --bins --target $env:BUILD_TARGET
      - name: Smoke test the host entry
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $binary = "./target/$env:BUILD_TARGET/release/ol-host$suffix"
          if (-not (Test-Path -LiteralPath $binary)) { throw 'The ol-host entry was not built' }
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'ol-host --version failed' }
          if (-not $version) { throw 'ol-host --version printed nothing' }
          Write-Host "ol-host $version"
      # 沙箱不随本包交付；沙箱二进制仍会构建，供 workspace 测试与后续独立发布使用。
      - name: Package the release
        run: python .github/scripts/package_release.py --target $env:BUILD_TARGET --channel $env:BUILD_CHANNEL --dist dist
      # 从解压后的发布包验收：校验链、--version、host.hello、host.info、
      # stdio EOF 清理退出、stdout 只有协议帧、缺沙箱时不虚报后端。
      - name: Verify and smoke-accept the packaged artifact
        run: |
          $archives = Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '\.(tar\.gz|zip)$' }
          if ($archives.Count -ne 1) { throw "Expected exactly one package archive, got $($archives.Count)" }
          python .github/scripts/smoke_host.py $archives[0].FullName
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
