name: Release
on:
  workflow_call:
    inputs:
      tag:
        description: Release Please tag whose existing release receives the assets
        type: string
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify assets and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
          sha256sum --check ./*.sha256
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz ./*.sha256 --clobber
