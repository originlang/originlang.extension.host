name: Release

# 发布唯一入口：push vX.Y.Z 标签（tag 即版本号，不依赖 release-please）。
#   git tag v0.1.1 && git push origin v0.1.1
# 触发后按 tag 跑 quality → test → build → 创建 Release 并挂资产。
# 平时分支的 CI 走 pipeline.yml；nightly 走 nightly.yml（由 pipeline.yml 编排）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ github.ref_name }}
  test:
    needs: quality
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.ref_name }}
  build:
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      channel: stable
      ref: ${{ github.ref_name }}
      release_tag: ${{ github.ref_name }}
  release:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/release-attach.yml
    with:
      tag: ${{ github.ref_name }}
