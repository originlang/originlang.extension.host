# 正式版发布只做传输完整性检查（sha256 侧车 + 资产计数）：包的校验链与冒烟验收
# 已在 build.yml 内对同一批产物完成，nightly 走同一 job，两个渠道的包结构一致。
name: Release attach
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose release receives the assets
        type: string
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify assets and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
          sha256sum --check ./*.sha256
          gh release create "$RELEASE_TAG" ./*.zip ./*.tar.gz ./*.sha256 \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "originlang-extension-host ${RELEASE_TAG#v}" \
            --generate-notes
