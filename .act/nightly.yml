name: Nightly

# originlang.extension.host 的本地夜间构建：编译 workspace 二进制 → 沙箱冒烟 →
# 打包 tar.gz（含 README/CHANGELOG/docs/examples）+ sha256。
# 产物只写到本仓库 dist/nightly/<stamp>/，不上传任何远端。
#
# 运行（在本仓库根目录）：
#   act -W .act/nightly.yml
#
# 版本取 version.txt（工作区统一版本源）；nightly 段用短 SHA 唯一标识，
# 与上游 .github/scripts/package.ps1 的 "run_id.sha8" 命名不同——本地无 GITHUB_RUN_ID。

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  nightly:
    name: 构建并打包
    runs-on: ubuntu-latest
    container:
      image: rust:1.99-bookworm
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - name: 取源码快照并计算版本
        id: src
        run: |
          set -euo pipefail
          src="$(pwd)"
          work=/work/extension.host
          git config --global --add safe.directory '*'
          test -d "$src/.git" || { echo "缺少仓库：$src" >&2; exit 1; }
          rm -rf "$work"; mkdir -p "$work"
          git -C "$src" archive --format=tar HEAD | tar -xf - -C "$work"

          base="$(tr -d '\r\n' < "$work/version.txt")"
          [ -n "$base" ] || { echo 'version.txt 为空' >&2; exit 1; }
          sha="$(git -C "$src" rev-parse --short=7 HEAD)"
          day="$(date -u +%Y%m%d)"
          stamp="nightly.${day}.$(date -u +%H%M)"
          pkg="${base}-nightly.${day}.${sha}"
          out="$src/dist/nightly/$stamp"
          mkdir -p "$out"
          {
            echo "base=$base"
            echo "pkg=$pkg"
            echo "sha=$sha"
            echo "stamp=$stamp"
            echo "branch=$(git -C "$src" rev-parse --abbrev-ref HEAD)"
            echo "dirty=$(git -C "$src" status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
            echo "out=$out"
          } >> "$GITHUB_OUTPUT"
          printf '版本 %s（HEAD %s）\n' "$pkg" "$sha"

      - name: 构建 release 二进制
        run: |
          set -euo pipefail
          cd /work/extension.host
          cargo build --locked --release --workspace --bins

      - name: 沙箱冒烟
        run: |
          set -euo pipefail
          cd /work/extension.host
          test -x target/release/oext-sandbox
          # 沙箱无命令行界面：stdin 关闭即退出 0，是不构造协议帧的最小启动检查。
          ./target/release/oext-sandbox </dev/null
          printf 'oext-sandbox 启动检查通过\n'

      - name: Host 冒烟
        run: |
          set -euo pipefail
          cd /work/extension.host
          test -x target/release/oext-host
          # 独立入口最小检查：--version 打印一行并退出 0。
          ./target/release/oext-host --version
          printf 'oext-host 启动检查通过\n'

      - name: 打包与校验和
        env:
          PKG: ${{ steps.src.outputs.pkg }}
          BASE: ${{ steps.src.outputs.base }}
          SHA: ${{ steps.src.outputs.sha }}
          STAMP: ${{ steps.src.outputs.stamp }}
          BRANCH: ${{ steps.src.outputs.branch }}
          DIRTY: ${{ steps.src.outputs.dirty }}
          OUT: ${{ steps.src.outputs.out }}
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          name="oext-${PKG}-${target}"
          stage="/work/stage/$name"
          rm -rf /work/stage
          mkdir -p "$stage" "$OUT"
          cd /work/extension.host
          install -m 0755 target/release/oext-sandbox "$stage/oext-sandbox"
          install -m 0755 target/release/oext-host "$stage/oext-host"
          cp README.md CHANGELOG.md "$stage/"
          cp -R docs examples "$stage/"
          cat > "$stage/build-info.json" <<EOF
          {
            "channel": "nightly",
            "repo": "originlang.extension.host",
            "version": "${BASE}",
            "packageVersion": "${PKG}",
            "commit": "${SHA}",
            "branch": "${BRANCH}",
            "dirtyFiles": ${DIRTY},
            "target": "${target}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          tar -czf "$OUT/$name.tar.gz" -C /work/stage "$name"
          cd "$OUT"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          printf '%s\n' "$PKG" > VERSION
          cat "$name.tar.gz.sha256"
          printf '产物目录：%s\n' "$OUT"
